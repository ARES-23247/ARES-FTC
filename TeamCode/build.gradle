//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlinx.kover'

// Mechanical subsystem registration and contract tests are disposable build products. Editable
// starters stay under src/ and are protected by the generator's ownership/diff contract.
def generatedAresSubsystemMainDir = file("${buildDir}/generated/ares/main/kotlin")
def generatedAresSubsystemTestDir = file("${buildDir}/generated/ares/test/kotlin")

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    sourceSets {
        main.java.srcDir generatedAresSubsystemMainDir
        test.java.srcDir generatedAresSubsystemTestDir
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
        excludes += ['META-INF/**/*.sha1', 'META-INF/**/*.dylib', 'META-INF/**/*.dll', 'META-INF/**/*.so']
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

configurations {
    simRun {
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
    aresCodegen
}

dependencies {
    implementation project(':FtcRobotController')
    implementation('com.github.ARES-23247.ARESLib-Kotlin:core:master-SNAPSHOT') { changing = true }
    implementation('com.github.ARES-23247.ARESLib-Kotlin:ftc-hardware:master-SNAPSHOT') { changing = true }
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    simRun('com.github.ARES-23247.ARESLib-Kotlin:simulator:master-SNAPSHOT') { changing = true }
    aresCodegen('com.github.ARES-23247.ARESLib-Kotlin:core:master-SNAPSHOT') { changing = true }
    aresCodegen 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

android.applicationVariants.all { variant ->
    if (variant.name == "debug") {
        task("runSim", type: JavaExec) {
            dependsOn variant.javaCompileProvider
            dependsOn "compile${variant.name.capitalize()}Kotlin"
            mainClass = 'com.areslib.sim.DesktopSimLauncher'
            
            // Use getCompileClasspath for Android libs, and simRun for transitive JVM dependencies
            classpath = files(
                configurations.simRun, // Place simRun (mocks) first so they override real FTC SDK classes!
                variant.javaCompileProvider.get().destinationDirectory,
                "${buildDir}/tmp/kotlin-classes/${variant.name}",
                variant.getCompileClasspath(null),
                project.android.bootClasspath
            )
            
            def appArgs = project.hasProperty("appArgs") ? project.property("appArgs").toString().split(" ") : []
            args(["--headless"] + appArgs)
        }
        
        task("runVerification", type: JavaExec) {
            dependsOn variant.javaCompileProvider
            dependsOn "compile${variant.name.capitalize()}Kotlin"
            mainClass = 'com.areslib.sim.VerificationAppKt'
            
            classpath = files(
                configurations.simRun,
                variant.javaCompileProvider.get().destinationDirectory,
                "${buildDir}/tmp/kotlin-classes/${variant.name}",
                variant.getCompileClasspath(null),
                project.android.bootClasspath
            )
            
            args = []
        }
    }
}

configurations.configureEach { configuration ->
    if (configuration.name != 'aresCodegen') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'org.java-websocket', module: 'Java-WebSocket'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'org.nanohttpd', module: 'nanohttpd'
    }
}

// The build-time generator runs on the desktop JVM and needs its full transitive classpath. Robot
// packaging exclusions above remain unchanged for every Android/runtime configuration.

def generatedAresSource = file(
    "src/main/java/org/firstinspires/ftc/teamcode/generated/GeneratedAresProject.kt"
)
def subsystemStarterSource = file(
    "src/main/java/org/firstinspires/ftc/teamcode/subsystems"
)
// Keep split roots configured even with no subsystem documents: generation then removes stale
// manifests/sources and emits the empty registry deterministically after the final definition is
// deleted. No ordinary build task creates or replaces editable starters.
def subsystemCodegenArgs = [
    "--subsystems-starter-output", subsystemStarterSource.absolutePath,
    "--subsystems-generated-output", generatedAresSubsystemMainDir.absolutePath,
    "--subsystems-generated-test-output", generatedAresSubsystemTestDir.absolutePath,
    "--subsystems-package", "org.firstinspires.ftc.teamcode.subsystems",
]
tasks.register("generateAresProject", JavaExec) {
    group = "ARES"
    description = "Generate checked-in project Kotlin and disposable subsystem plumbing; never replace starters."
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC"
    args subsystemCodegenArgs
}

tasks.register("prepareAresSubsystemPlumbing", JavaExec) {
    group = "build setup"
    description = "Materialize disposable subsystem registration/tests without modifying editable starters."
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC",
        "--subsystems-only"
    args subsystemCodegenArgs
}

tasks.register("previewSubsystemChanges", JavaExec) {
    group = "ARES"
    description = "Preview categorized subsystem starter changes and safety warnings without writing files."
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC",
        "--subsystems-only",
        "--preview-subsystem-starters"
    args subsystemCodegenArgs
}

tasks.register("generateSubsystemStarters", JavaExec) {
    group = "ARES"
    description = "Create missing editable subsystem starters and generated plumbing; refuse replacements."
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC",
        "--subsystems-only",
        "--apply-subsystem-starters"
    args subsystemCodegenArgs
}

tasks.register("replaceSubsystemStarters", JavaExec) {
    group = "ARES"
    description = "Replace changed generated starters only with the exact token printed by preview."
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC",
        "--subsystems-only",
        "--apply-subsystem-starters"
    args subsystemCodegenArgs
    doFirst {
        def token = providers.gradleProperty("ares.subsystemReplacementToken").orNull
        if (token == null || token.trim().isEmpty()) {
            throw new GradleException(
                "Run previewSubsystemChanges, review its structured diff, then pass " +
                    "-Pares.subsystemReplacementToken=<exact-token>."
            )
        }
        args "--subsystems-confirmation-token", token
    }
}

tasks.register("verifyAresProject", JavaExec) {
    group = "verification"
    description = "Fail when checked-in project Kotlin, starters, or generated subsystem plumbing is stale."
    dependsOn tasks.named("prepareAresSubsystemPlumbing")
    classpath = configurations.aresCodegen
    mainClass = "com.areslib.codegen.AresProjectCodegenCli"
    args "--project", rootProject.projectDir.absolutePath,
        "--output", generatedAresSource.absolutePath,
        "--package", "org.firstinspires.ftc.teamcode.generated",
        "--platform", "FTC",
        "--check"
    args subsystemCodegenArgs
}

tasks.matching { task -> task.name.startsWith("compile") && task.name.endsWith("Kotlin") }.configureEach {
    dependsOn tasks.named("verifyAresProject")
}

koverReport {
    defaults {
        filters {
            excludes {
                classes("org.firstinspires.ftc.teamcode.opmodes.*")
            }
        }
    }
    androidReports("debug") {
        filters {
            excludes {
                classes("org.firstinspires.ftc.teamcode.opmodes.*")
            }
        }
    }
}

