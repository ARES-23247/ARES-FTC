name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ftc-codeql-${{ github.ref }}
  cancel-in-progress: true

# Keep CodeQL's composite build on the same ARESLib feature ref as the FTC integration PR. Master,
# schedules, and unrelated branches continue to analyze against protected ARESLib master.
env:
  ARESLIB_REF: ${{ (github.head_ref || github.ref_name) == 'codex/subsystem-authoring-v2' && 'codex/subsystem-authoring-v2' || 'master' }}

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FTC
        uses: actions/checkout@v4
        with:
          path: ARES-FTC

      - name: Check out ARESLib
        uses: actions/checkout@v4
        with:
          repository: ARES-23247/ARESLib-Kotlin
          ref: ${{ env.ARESLIB_REF }}
          path: ARESLib-Kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-FTC/TeamCode/src
              - ARES-FTC/simulator/src
            paths-ignore:
              - ARES-FTC/FtcRobotController/**
              - ARESLib-Kotlin/**

      - name: Compile FTC and simulator sources
        working-directory: ARES-FTC
        run: ./gradlew :TeamCode:assembleDebug :simulator:compileKotlin --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
