name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ftc-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out FTC
        uses: actions/checkout@v4
        with:
          path: ARES-FTC

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config: |
            paths:
              - ARES-FTC/TeamCode/src
              - ARES-FTC/simulator/src
            paths-ignore:
              - ARES-FTC/FtcRobotController/**

      - name: Compile FTC and simulator sources
        working-directory: ARES-FTC
        run: ./gradlew :TeamCode:assembleDebug :simulator:compileKotlin --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
