// Configuration must not rewrite user-wide Gradle settings. The invoking IDE or shell owns the
// Gradle JVM selection; fail with portable guidance when it is too old for Android builds.
def currentJava = JavaVersion.current()
if (!currentJava.isCompatibleWith(JavaVersion.VERSION_17)) {
    throw new GradleException(
        "ARES FTC requires a Gradle JVM on Java 17 or newer " +
            "(currently ${System.getProperty('java.version')}). Set JAVA_HOME or select a compatible " +
            "Gradle JVM in Android Studio, then run the command again. No user-level Gradle files were changed."
    )
}

include ':FtcRobotController'
include ':TeamCode'
include ':simulator'

def useSiblingAresLib = providers.gradleProperty('aresUseSiblingLib')
    .map { it.toBoolean() }
    .getOrElse(false)
if (useSiblingAresLib && file('../ARESLib-Kotlin').exists()) {
    includeBuild('../ARESLib-Kotlin') {
        dependencySubstitution {
            substitute module('org.aresfirst.ares:core') using project(':core')
            substitute module('org.aresfirst.ares:codegen') using project(':codegen')
            substitute module('org.aresfirst.ares:ftc-hardware') using project(':ftc-hardware')
            substitute module('org.aresfirst.ares:simulator') using project(':simulator')
            substitute module('org.aresfirst.ares:ftc-mocks') using project(':ftc-mocks')
            substitute module('org.aresfirst.ares:simulator-runtime-windows') using project(':simulator-runtime-windows')
            substitute module('org.aresfirst.ares:simulator-runtime-linux') using project(':simulator-runtime-linux')
            substitute module('org.aresfirst.ares:simulator-runtime-macos') using project(':simulator-runtime-macos')
            substitute module('org.aresfirst.ares:ares-bom') using project(':ares-bom')
        }
    }
}
